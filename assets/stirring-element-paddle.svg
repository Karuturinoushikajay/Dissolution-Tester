  <text class="title" x="28" y="42">NOTES </text>
  <text class="note" x="28" y="70">(1) Shaft and blade: 303 (or equivalent) stainless steel.</text>
  <text class="note" x="28" y="94">(2) A and B vary d 0.5 mm when rotated on CL axis.</text>
  <text class="note" x="28" y="118">(3) Tolerances ± 1.0 mm unless otherwise stated.</text>
